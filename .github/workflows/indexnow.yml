name: Notify search engines (IndexNow)

# After each push, waits for GitHub Pages to deploy, then tells Bing, Yandex, Seznam, Naver
# (and everyone using IndexNow) which pages exist, so new pages are crawled within hours.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(cat .indexnow_key)
          URLS=$(python3 -c "import re;print(','.join('\"'+u+'\"' for u in re.findall(r'<loc>(.*?)</loc>', open('sitemap.xml').read())))")
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"toolsforworld.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://toolsforworld.com/$KEY.txt\",\"urlList\":[$URLS]}"
